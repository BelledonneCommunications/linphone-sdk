macos-upload:
  stage: deploy
  tags: [ "macos-xcode13-flat" ]

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DEPLOY_MACOS != null
  variables:
    GIT_FETCH_EXTRA_FLAGS: --tags --force --recurse-submodules=yes
    GIT_SUBMODULE_UPDATE_FLAGS: --jobs 8 --force --recursive
  needs:
    - macos-xcode

  script:
    - DESCRIBE=$(git -C liblinphone describe)
    - echo $DESCRIBE
    - !reference [.choose_upload_dir, script]
    - rsync -rlv --ignore-existing build/mac/linphone-sdk-*.zip $DEPLOY_SERVER:$UPLOAD_ROOT_DIRECTORY/macosx/sdk
    - pod repo remove linphone-sdk-macosx || true
    - pod repo add linphone-sdk-macosx git@gitlab.linphone.org:BC/public/podspec-macos.git master
    - pod repo push linphone-sdk-macosx build/mac/linphone-sdk.podspec --skip-import-validation --verbose --allow-warnings
    - cd ~/.cocoapods/repos/linphone-sdk-macosx && git push origin master && cd -
    - pod repo remove linphone-sdk-macosx


macos-ninja-spm-upload:
  stage: deploy
  tags: [ "macos-xcode13-flat" ]

  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $DEPLOY_MACOS != null
    - !reference [.rules-merge-request-manual, rules]
  variables:
    GIT_FETCH_EXTRA_FLAGS: --tags --force --recurse-submodules=yes
    GIT_SUBMODULE_UPDATE_FLAGS: --jobs 8 --force --recursive
    SWIFT_PACKAGE_FLAVOR: ""
    PUBLIC_SPM_GIT_REPO: git@gitlab.linphone.org:BC/public/linphone-sdk-swift-macos.git
    PRIVATE_SPM_GIT_REPO: git@gitlab.linphone.org:BC/private/private-linphone-sdk-swift-macos.git
    SPM_PRIVATE: ""
  needs:
    - macos-ninja-spm

  script:
    - DESCRIBE=$(git describe)
    - echo $DESCRIBE
    - !reference [.choose_upload_dir, script]
    - !reference [.choose_url_macos, script]
    - |
      if [ -n "$SPM_PRIVATE" ]; then
        SPM_URL_TOKEN=$(openssl rand -hex 16)
        if [ ${#SPM_URL_TOKEN} -ne 32 ]; then
          echo "Failed to generate a random directory name, refusing to deploy to a predictable location."
          exit 1
        fi
        if ! grep -q '@@PRIVATE_SPM_BASE_URL@@' build/mac/linphone-sdk-swift-macos/Package.swift; then
          echo "Package.swift holds no private base url placeholder, refusing to deploy."
          exit 1
        fi
        sed -i '' "s|@@PRIVATE_SPM_BASE_URL@@|${MACOS_URL}/private-spm/${SPM_URL_TOKEN}|g" build/mac/linphone-sdk-swift-macos/Package.swift
        SPM_GIT_REPO="$PRIVATE_SPM_GIT_REPO"
        SPM_DEPLOY_SERVER="$DEPLOY_SERVER"
        SPM_UPLOAD_PATH="$UPLOAD_ROOT_DIRECTORY/macos/sdk/private-spm/$SPM_URL_TOKEN"
        SPM_UPLOAD_SOURCE="build/mac/linphone-sdk-swift-macos/XCFrameworks/"
        SPM_UPLOAD_SUBPATH="/XCFrameworks"
      else
        SPM_GIT_REPO="$PUBLIC_SPM_GIT_REPO"
        SPM_DEPLOY_SERVER="$DEPLOY_SERVER"
        SPM_UPLOAD_PATH="$UPLOAD_ROOT_DIRECTORY/macos/sdk/spm/$SWIFT_PACKAGE_FLAVOR"
        SPM_UPLOAD_SOURCE="build/mac/linphone-sdk-swift-macos/"
        SPM_UPLOAD_SUBPATH=""
      fi
      echo "Deploying Swift package to $SPM_GIT_REPO"
    - |
        if [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]]; then
          TARGET_BRANCH="${SWIFT_PACKAGE_FLAVOR}$CI_COMMIT_REF_NAME"
        else
          TARGET_BRANCH="${SWIFT_PACKAGE_FLAVOR}${SPM_DEPLOY_TARGET_BRANCH}"
        fi
    - VERSION=$(tr -d '\n\r' < build/mac/linphone-sdk-swift-macos/VERSION)
    - |
      if [ -n "$SPM_PRIVATE" ] && ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Skipping private spm deployment as version $VERSION is not a final x.y.z release."
        exit 0
      fi
    - |
      if [ -n "$SWIFT_PACKAGE_FLAVOR" ]; then
        FLAVOR_SUFFIX="-$(echo "$SWIFT_PACKAGE_FLAVOR" | sed 's/\///g')"
      else
        FLAVOR_SUFFIX=""
      fi
      SPM_TAG="${VERSION}${FLAVOR_SUFFIX}"
      if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        VERSION_MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
        TAG_REGEX="^${VERSION_MAJOR_MINOR//./\\.}\\.[0-9]+${FLAVOR_SUFFIX}\$"
        LATEST_LINE_VERSION=$(git ls-remote --tags --refs "$SPM_GIT_REPO" \
          | sed 's#.*refs/tags/##' \
          | { grep -E "$TAG_REGEX" || true; } \
          | sed "s#${FLAVOR_SUFFIX}\$##" \
          | sort -V | tail -n1)
        echo "Latest deployed version on the ${VERSION_MAJOR_MINOR} line: ${LATEST_LINE_VERSION:-none}"
        if [ -n "$LATEST_LINE_VERSION" ]; then
          HIGHEST_VERSION=$(printf '%s\n%s\n' "$VERSION" "$LATEST_LINE_VERSION" | sort -V | tail -n1)
          if [ "$VERSION" = "$LATEST_LINE_VERSION" ] || [ "$HIGHEST_VERSION" != "$VERSION" ]; then
            echo "Skipping public spm deployment as deployed version $LATEST_LINE_VERSION on the $VERSION_MAJOR_MINOR line is greater than or equal to $VERSION."
            exit 0
          fi
        fi
      elif [ "${TARGET_BRANCH#"$SWIFT_PACKAGE_FLAVOR"}" = "stable" ]; then
        echo "Skipping public spm deployment as version $VERSION is not a final x.y.z release and $TARGET_BRANCH only receives final releases."
        exit 0
      elif [ -n "$(git ls-remote --tags --refs "$SPM_GIT_REPO" "refs/tags/$SPM_TAG")" ]; then
        echo "Skipping public spm deployment as $SPM_TAG is already deployed."
        exit 0
      fi
    - echo "Uploading SPM $VERSION to $SPM_DEPLOY_SERVER:$SPM_UPLOAD_PATH"
    - ssh $SPM_DEPLOY_SERVER mkdir -p "$SPM_UPLOAD_PATH/linphone-sdk-swift-macos-$VERSION$SPM_UPLOAD_SUBPATH"
    - rsync -ar "$SPM_UPLOAD_SOURCE" $SPM_DEPLOY_SERVER:$SPM_UPLOAD_PATH/linphone-sdk-swift-macos-$VERSION$SPM_UPLOAD_SUBPATH/
    - rm -rf build/mac/linphone-sdk-swift-macos/XCFrameworks
    - echo "Publishing SPM to branch $TARGET_BRANCH."
    - cd build/mac
    - git clone "$SPM_GIT_REPO" deploy-linphone-sdk-swift-macos
    - cd deploy-linphone-sdk-swift-macos
    - |
      MOVE_BRANCH=1
      if git checkout "$TARGET_BRANCH"; then
        HEAD_VERSION=""
        if [ -f VERSION ]; then
          HEAD_VERSION=$(tr -d '\n\r' < VERSION)
        fi
        HEAD_MAJOR_MINOR=$(echo "$HEAD_VERSION" | cut -d. -f1,2)
        VERSION_MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
        if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
          && echo "$HEAD_MAJOR_MINOR" | grep -qE '^[0-9]+\.[0-9]+$' \
          && [ "$HEAD_MAJOR_MINOR" != "$VERSION_MAJOR_MINOR" ] \
          && [ "$(printf '%s\n%s\n' "$VERSION_MAJOR_MINOR" "$HEAD_MAJOR_MINOR" | sort -V | tail -n1)" = "$HEAD_MAJOR_MINOR" ]; then
          echo "Branch $TARGET_BRANCH holds the newer $HEAD_MAJOR_MINOR line ($HEAD_VERSION): publishing tag $SPM_TAG only."
          MOVE_BRANCH=0
        fi
      else
        git checkout -b "$TARGET_BRANCH"
      fi
    - rsync -ar ../linphone-sdk-swift-macos/* .
    - git add .
    - git commit -a -m "Swift package $VERSION $SWIFT_PACKAGE_FLAVOR"
    - |
      if [ "$MOVE_BRANCH" = "1" ]; then
        git push || git push --set-upstream origin $TARGET_BRANCH
      fi
    - git tag -a $SPM_TAG -m "linphone-sdk $VERSION"
    - git push --tags

macos-ninja-spm-upload-novideo:
  needs:
    - macos-ninja-spm-novideo
  variables:
    SWIFT_PACKAGE_FLAVOR: "novideo/"
  extends: macos-ninja-spm-upload

macos-ninja-spm-upload-private:
  needs:
    - macos-ninja-spm-private
  variables:
    SPM_PRIVATE: "true"
  extends: macos-ninja-spm-upload
